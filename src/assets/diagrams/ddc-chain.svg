<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 295' width='1000' height='295' role='img' aria-label='Block diagram of the digital down-conversion chain: ADC, 99-tap complex FIR, NCO mixer and decimate-by-13 polyphase filter, all at 416 MHz.'><title>Block diagram of the digital down-conversion chain: ADC, 99-tap complex FIR, NCO mixer and decimate-by-13 polyphase filter, all at 416 MHz.</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555e66'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><rect x='185' y='40' width='795' height='215' rx='12' fill='none' stroke='#0b6e69' stroke-width='1.2' stroke-dasharray='6 5'/><text x='197' y='58' text-anchor='start' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11.5' font-weight='600' fill='#0b6e69'>FPGA · Artix-7 200T · single clock domain at 416 MHz (2.4 ns)</text><rect x='20' y='105' width='140' height='90' rx='8' fill='#f4f5f6' stroke='#555e66' stroke-width='1.6'/><text x='90.0' y='138.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>High-speed ADC</text><text x='90.0' y='158.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>bandpass</text><text x='90.0' y='174.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>(under)sampling</text><rect x='205' y='95' width='210' height='110' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='310.0' y='130.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Complex FIR</text><text x='310.0' y='150.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-s