<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' width='1000' height='330' role='img' aria-label='Measurement chain of one signal: converter, current sensor, scaling divider and RC anti-aliasing filter, ADC sample-and-hold on the C2000, UART streaming to MATLAB.'><title>Measurement chain of one signal: converter, current sensor, scaling divider and RC anti-aliasing filter, ADC sample-and-hold on the C2000, UART streaming to MATLAB.</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555e66'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><rect x='20' y='110' width='150' height='90' rx='8' fill='#f4f5f6' stroke='#555e66' stroke-width='1.6'/><text x='95.0' y='143.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>GaN resonant</text><text x='95.0' y='163.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>converter</text><text x='95.0' y='179.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>EPC2216, 9 signals</text><rect x='205' y='110' width='160' height='90' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='285.0' y='135.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Sensor</text><text x='285.0' y='155.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>Hall (MCA1101)</text><text x='285.0' y='171.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>coreless (CT432)</text><text x='285.0' y='187.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>shunt amp (INA280-Q1)</text><rect x='400' y='110' width='190' height='90' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='495.0' y='135.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>ADC input network</text><text x='495.0' y='155.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>scaling divider</text><text x='495.0' y='171.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>RC anti-aliasing filter</text><text x='495.0' y='187.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>charge-sharing capacitor</text><rect x='625' y='110' width='150' height='90' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='700.0' y='143.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>ADC S/H</text><text x='700.0' y='163.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>C2000 F28379D</text><text x='700.0' y='179.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>4 ADCs · 12/16-bit</text><rect x='810' y='110' width='170' height='90' rx='8' fill='#f4f5f6' stroke='#555e66' stroke-width='1.6'/><text x='895.0' y='143.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>MATLAB</text><text x='895.0' y='163.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fil