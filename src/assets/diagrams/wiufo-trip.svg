<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' width='1000' height='300' role='img' aria-label='Hardware-only overcurrent protection: CMPSS window comparator, ePWM X-BAR, Digital Compare on both outputs A and B, Trip Zone forces both PWM outputs off. 24.4 ns measured.'><title>Hardware-only overcurrent protection: CMPSS window comparator, ePWM X-BAR, Digital Compare on both outputs A and B, Trip Zone forces both PWM outputs off. 24.4 ns measured.</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555e66'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><rect x='20' y='105' width='140' height='90' rx='8' fill='#f4f5f6' stroke='#555e66' stroke-width='1.6'/><text x='90.0' y='146.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Current signal</text><text x='90.0' y='166.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>from the sensor chain</text><rect x='195' y='95' width='180' height='110' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='285.0' y='130.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>CMPSS</text><text x='285.0' y='150.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>window comparator</text><text x='285.0' y='166.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>2 DAC thresholds</text><text x='285.0' y='182.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>(high and low)</text><rect x='410' y='105' width='140' height='90' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='480.0' y='146.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>ePWM X-BAR</text><text x='480.0' y='166.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>routes the trip</text><rect x='585' y='60' width='160' height='70' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='665.0' y='99.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Digital Compare A</text><rect x='585' y='170' width='160' height='70' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='665.0' y='209.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Digital Compare B</text><rect x='780' y='105' width='190' height='90' rx='8' fill='#fff6e0' stroke='#c99a2e' stroke-width='1.6'/><text x='875.0' y='146.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Trip Zone</text><text x='875.0' y='166.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>PWM A and B forced off</text><path d='M160,150 L193,150' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M375,150 L408,150' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M550,140 L565,140 L565,95 L583,95' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M550,160 L565,160 L565,205 L583,205' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M745,95 L760,95 L760,135 L778,135' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M745,205 L760,205 L760,165 L778,165' fill='none' stroke='#555e66' stroke-width='1.6' marker-end='url(#a)'/><path d='M195,265 L970,265' stroke='#0b6e69' stroke-width='2' marker-end='url(#a)' marker-start='url(#a)'/><text x='582' y='257' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='13' font-weight='600' fill='#1b1f23'>measured on the oscilloscope: 24.4 ns from threshold crossing to PWM shutdown</text><text x='582' y='288' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#555e66'>No CPU in the path: it still works if the firmware hangs</text><text x='665' y='155' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11' font-weight='400' fill='#0b6e69'>both paths needed</text></svg>