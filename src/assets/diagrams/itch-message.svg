<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 290' width='1000' height='290' role='img' aria-label='Byte layout of an ITCH 5.0 Add Order message: 2-byte length prefix, then type, stock locate, tracking number, 6-byte timestamp, order reference, side, shares, stock and price, 36 bytes in total.'><title>Byte layout of an ITCH 5.0 Add Order message: 2-byte length prefix, then type, stock locate, tracking number, 6-byte timestamp, order reference, side, shares, stock and price, 36 bytes in total.</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555e66'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='500' y='34' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='15' font-weight='600' fill='#1b1f23'>One ITCH 5.0 &quot;Add Order&quot; (A) message in the binary file</text><rect x='44.0' y='70' width='48' height='60' fill='#f4f5f6' stroke='#555e66'/><text x='68.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>len</text><text x='68.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>2</text><rect x='92.0' y='70' width='24' height='60' fill='#fff6e0' stroke='#555e66'/><text x='104.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>T</text><text x='104.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>1</text><rect x='116.0' y='70' width='48' height='60' fill='#e2f1ef' stroke='#555e66'/><text x='140.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>loc</text><text x='140.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>2</text><rect x='164.0' y='70' width='48' height='60' fill='#e2f1ef' stroke='#555e66'/><text x='188.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>trk</text><text x='188.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>2</text><rect x='212.0' y='70' width='144' height='60' fill='#e2f1ef' stroke='#555e66'/><text x='284.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>timestamp</text><text x='284.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>6</text><rect x='356.0' y='70' width='192' height='60' fill='#e2f1ef' stroke='#555e66'/><text x='452.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>order ref</text><text x='452.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>8</text><rect x='548.0' y='70' width='24' height='60' fill='#e8eefc' stroke='#555e66'/><text x='560.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>S</text><text x='560.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>1</text><rect x='572.0' y='70' width='96' height='60' fill='#e8eefc' stroke='#555e66'/><text x='620.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>shares</text><text x='620.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>4</text><rect x='668.0' y='70' width='192' height='60' fill='#e8eefc' stroke='#555e66'/><text x='764.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>stock</text><text x='764.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>8</text><rect x='860.0' y='70' width='96' height='60' fill='#e8eefc' stroke='#555e66'/><text x='908.0' y='98' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#1b1f23'>price</text><text x='908.0' y='118' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' font-weight='400' fill='#555e66'>4</text><path d='M46.0,140 L46.0,150 L90.0,150 L90.0,140' fill='none' stroke='#555e66' stroke-width='1.5'/><text x='68.0' y='170' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#555e66'>length</text><path d='M94.0,140 L94.0,150 L546.0,150 L546.0,140' fill='none' stroke='#0b6e69' stroke-width='1.5'/><text x='320.0' y='170' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#0b6e69'>common header (A, E, X, D)</text><path d='M550.0,140 L550.0,150 L954.0,150 L954.0,140' fill='none' stroke='#3b5bb5' stroke-width='1.5'/><text x='752.0' y='170' text-anchor='middle' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' font-weight='400' fill='#3b5bb5'>Add Order fields</text><text x='500' y='215' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#555e66'>Sizes in bytes, big-endian. T = message type, loc = stock locate, trk = tracking number, S = buy/sell side.</text><text x='500' y='245' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1b1f23'>Body = 36 bytes. Other message types are skipped using the length prefix.</text></svg>