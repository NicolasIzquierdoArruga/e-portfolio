<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 345' width='1000' height='345' role='img' aria-label='ADC bring-up: a reset state machine polls the ADC configuration-ready bit, then a second state machine writes and reads back 44 registers with masks and retries over SPI.'><title>ADC bring-up: a reset state machine polls the ADC configuration-ready bit, then a second state machine writes and reads back 44 registers with masks and retries over SPI.</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555e66'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><rect x='15' y='30' width='620' height='290' rx='12' fill='none' stroke='#0b6e69' stroke-width='1.2' stroke-dasharray='6 5'/><text x='27' y='48' text-anchor='start' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11.5' font-weight='600' fill='#0b6e69'>FPGA (VHDL)</text><rect x='35' y='70' width='170' height='80' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='120.0' y='98.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Reset FSM</text><text x='120.0' y='118.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>reset the ADC</text><text x='120.0' y='134.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' fill='#555e66'>poll &quot;config ready&quot;</text><rect x='250' y='70' width='170' height='80' rx='8' fill='#e2f1ef' stroke='#0b6e69' stroke-width='1.6'/><text x='335.0' y='98.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='600' fill='#1b1f23'>Config FSM</text><text x='335.0' y='118.0' text-anchor='middle' font-family='system-ui,-apple-system,Segoe 